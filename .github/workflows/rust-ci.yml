name: Rust CI

on:
  push:
    branches: [ main ]
    paths:
      - 'pc/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'pc/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./pc

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          pc/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('pc/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy -- -D warnings

    - name: Build
      run: cargo build --release

    - name: Run tests
      run: cargo test
